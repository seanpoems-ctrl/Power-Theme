name: Emergency News Monitor

on:
  workflow_dispatch: {}
  schedule:
    # Breaking news: Every 30 min during US market hours + pre/after-market
    # 12:00-21:00 UTC = 8 AM–5 PM ET Mon-Fri (covers pre-market + full session + AH)
    - cron: '0,30 12-21 * * 1-5'   # Mon-Fri, 20 runs/day

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  breaking-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-breaking-news-v1
          restore-keys: pip-breaking-news-

      - name: Install deps
        run: pip install requests python-dotenv google-genai beautifulsoup4

      - name: Run Emergency News Monitor
        run: python breaking_news.py
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit breaking news data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/breaking_news.json
          git diff --staged --quiet || git commit -m "data: breaking_news $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done

      - uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-

      - name: Build React app
        run: npm ci --legacy-peer-deps && npm run build
        env:
          CI: false
          REACT_APP_FINNHUB_KEY: ${{ secrets.FINNHUB_API_KEY }}
          REACT_APP_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          REACT_APP_TV_PROXY_URL: ${{ secrets.TV_PROXY_URL }}

      # Same guard as deploy.yml: this workflow also builds and deploys the whole
      # site, so a build without REACT_APP_TV_PROXY_URL / REACT_APP_FINNHUB_KEY
      # silently replaces a good deploy with one where Mini Charts show
      # "Bar-data proxy not configured" and news/catalysts have no data
      # (found 2026-10-01: this workflow's last run had removed both).
      - name: Verify required secrets reached the build
        env:
          TV_PROXY_URL: ${{ secrets.TV_PROXY_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          fail=0
          check() {
            name="$1"; value="$2"
            if [ -z "$value" ]; then
              echo "::error::$name repo secret is empty or missing."
              fail=1
              return
            fi
            if ! grep -rqF -- "$value" build/static/js/*.js; then
              echo "::error::$name is set but never made it into the build output."
              fail=1
            fi
          }
          check "TV_PROXY_URL" "$TV_PROXY_URL"
          check "FINNHUB_API_KEY" "$FINNHUB_API_KEY"
          if [ "$fail" = "1" ]; then
            echo "::error::Blocking deploy - a broken build must not reach production silently."
            exit 1
          fi
          echo "TV_PROXY_URL and FINNHUB_API_KEY both present in build output."

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

      - id: deployment
        uses: actions/deploy-pages@v5
