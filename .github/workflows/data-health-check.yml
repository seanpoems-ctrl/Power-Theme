name: Data Health Check

# Runs every morning Malaysia time — alerts via GitHub Issue if any data is stale
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 23 * * 1-5"   # 7:00 PM ET / 7:00 AM Malaysia (next day)

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check data freshness (content-aware)
        id: check
        # Validates each file's INTERNAL date + content completeness — not mtime,
        # which a daily builder refreshes even when it ships stale/empty content.
        # continue-on-error so the alert step still runs when issues are found
        # (the script exits 1 on issues, which is useful for local/manual runs).
        continue-on-error: true
        run: python data_health_check.py

      - name: Create GitHub Issue alert
        if: steps.check.outputs.has_issues == 'true'
        run: |
          gh issue create \
            --title "⚠️ Stale Dashboard Data — $(date -u +%Y-%m-%d)" \
            --body "$(echo '${{ steps.check.outputs.issue_body }}' | tr '%0A' '\n')" \
            --label "data-stale"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
