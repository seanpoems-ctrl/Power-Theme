# Focus List scan — meant to run ~68 min after the 4:00 PM ET close so any
# after-market-close (AMC) earnings prints have landed in TradingView's data
# before the scan captures a snapshot.
#
# GitHub's scheduler routinely fires cron jobs 1-3 hours late, so instead of a
# tight "5:08 PM ET exactly" gate (which got missed every single day) the
# window is now the whole post-close evening, and an "already scanned today"
# guard keeps it to one run per trading day whenever it actually fires.
name: Focus List Scan

on:
  workflow_dispatch: {}
  schedule:
    - cron: '10 21 * * 1-5'  # ~5:10 PM ET during EDT (UTC-4)
    - cron: '10 22 * * 1-5'  # ~5:10 PM ET during EST (UTC-5)

concurrency:
  group: focus-list-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check NYSE trading day + ET window (~68 min after close)
        id: trading_day
        run: |
          pip install exchange-calendars -q
          python - <<'EOF'
          import exchange_calendars as xcals, json, os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          is_manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          nyse = xcals.get_calendar("XNYS")
          et_now = datetime.now(ZoneInfo("America/New_York"))
          et_date = et_now.strftime("%Y-%m-%d")
          is_session = nyse.is_session(et_date)

          et_minutes = et_now.hour * 60 + et_now.minute
          # Wide post-close window: 5:00 PM ET (~68 min after close, enough for AMC
          # earnings to land) through 11:59 PM ET. GitHub's scheduler fires cron
          # jobs 1-3h late, so a tight window gets missed every day.
          in_window = 1020 <= et_minutes <= 1439  # 5:00 PM – 11:59 PM ET

          # Only scan once per trading day. scan_time in focus_list.json is a UTC
          # ISO string; a run started the same ET evening but after UTC midnight
          # would carry the next calendar date, so accept either.
          already_scanned = False
          try:
              with open("public/focus_list.json") as f:
                  prev_date = (json.load(f).get("scan_time", "") or "")[:10]
              utc_date = datetime.now(ZoneInfo("UTC")).strftime("%Y-%m-%d")
              already_scanned = prev_date in (et_date, utc_date)
          except Exception:
              pass

          if is_manual:
              should_run = True
              print(f"Manual trigger — forcing run (session={is_session}, ET={et_now:%H:%M})")
          else:
              should_run = is_session and in_window and not already_scanned
              print(f"session={is_session} | ET={et_now:%H:%M} | in_window={in_window} | "
                    f"already_scanned={already_scanned} | will_run={should_run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")
          EOF

      - name: Install deps
        if: steps.trading_day.outputs.should_run == 'true'
        run: pip install tradingview_screener pandas python-dotenv

      - name: Run Focus List scanner (retry on failure)
        if: steps.trading_day.outputs.should_run == 'true'
        env:
          CI: true
        run: |
          for attempt in 1 2 3; do
            echo "=== Focus List scan attempt $attempt / 3 ==="
            if python focus_list_scanner.py; then
              echo "Focus List scan OK"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Failed — waiting 60s before retry..."
              sleep 60
            fi
          done
          echo "Focus List scan failed after 3 attempts"
          exit 1

      - name: Commit Focus List data to repo
        if: steps.trading_day.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add public/focus_list.json
          git diff --staged --quiet || git commit -m "data: focus_list $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          pushed=false
          for i in 1 2 3 4 5; do
            if git push; then pushed=true; break; fi
            echo "Push attempt $i failed — pulling and retrying in 15s..."
            sleep 15
            git pull --rebase --autostash
          done
          if [ "$pushed" = "false" ]; then
            echo "ERROR: failed to push Focus List data after 5 attempts"
            exit 1
          fi
