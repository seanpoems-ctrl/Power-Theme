# Focus List scan — runs 68 min after the 4:00 PM ET close (5:08 PM ET), not
# right at the bell, so any after-market-close (AMC) earnings prints have time
# to land in TradingView's data before the scan captures a snapshot.
# Two cron entries cover both DST states; the ET-window check in Python below
# accepts only the one that's actually 5:08 PM ET right now and rejects the
# other (which will be off by an hour), so exactly one run proceeds per day.
name: Focus List Scan

on:
  workflow_dispatch: {}
  schedule:
    - cron: '8 21 * * 1-5'  # 5:08 PM ET during EDT (UTC-4)
    - cron: '8 22 * * 1-5'  # 5:08 PM ET during EST (UTC-5)

concurrency:
  group: focus-list-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check NYSE trading day + ET window (~68 min after close)
        id: trading_day
        run: |
          pip install exchange-calendars -q
          python - <<'EOF'
          import exchange_calendars as xcals, os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          is_manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          nyse = xcals.get_calendar("XNYS")
          today = date.today().isoformat()
          is_session = nyse.is_session(today)

          et_now = datetime.now(ZoneInfo("America/New_York"))
          et_minutes = et_now.hour * 60 + et_now.minute
          # Target 5:08 PM ET (1028 min) = close + 68 min. Window absorbs
          # GitHub Actions scheduling jitter and rejects whichever of the two
          # cron fires lands an hour off due to the current DST state.
          in_window = 1023 <= et_minutes <= 1058  # 5:03 PM – 5:58 PM ET

          if is_manual:
              should_run = True
              print(f"Manual trigger — forcing run (session: {is_session}, ET: {et_now.strftime('%H:%M')})")
          else:
              should_run = is_session and in_window
              print(f"NYSE session: {is_session} | ET time: {et_now.strftime('%H:%M')} | in window: {in_window} | will run: {should_run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")
          EOF

      - name: Install deps
        if: steps.trading_day.outputs.should_run == 'true'
        run: pip install tradingview_screener pandas python-dotenv

      - name: Run Focus List scanner (retry on failure)
        if: steps.trading_day.outputs.should_run == 'true'
        env:
          CI: true
        run: |
          for attempt in 1 2 3; do
            echo "=== Focus List scan attempt $attempt / 3 ==="
            if python focus_list_scanner.py; then
              echo "Focus List scan OK"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Failed — waiting 60s before retry..."
              sleep 60
            fi
          done
          echo "Focus List scan failed after 3 attempts"
          exit 1

      - name: Commit Focus List data to repo
        if: steps.trading_day.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add public/focus_list.json
          git diff --staged --quiet || git commit -m "data: focus_list $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          pushed=false
          for i in 1 2 3 4 5; do
            if git push; then pushed=true; break; fi
            echo "Push attempt $i failed — pulling and retrying in 15s..."
            sleep 15
            git pull --rebase --autostash
          done
          if [ "$pushed" = "false" ]; then
            echo "ERROR: failed to push Focus List data after 5 attempts"
            exit 1
          fi
