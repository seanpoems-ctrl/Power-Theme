name: Market Intelligence Engine

on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 11 * * 1-5"   # 7:05 AM ET — AM brief (Malaysia 7:05 PM)
    - cron: "45 20 * * 1-5"  # 4:45 PM ET — PM brief (Malaysia 4:45 AM next day)

jobs:
  market-intel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      is_trading_day: ${{ steps.trading_day.outputs.is_trading_day }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-market-intel-v1
          restore-keys: pip-market-intel-

      - name: Install deps
        run: |
          pip install requests httpx yfinance pandas python-dotenv google-genai \
                      tradingview-screener beautifulsoup4

      - name: Always run — no trading day restriction
        id: trading_day
        run: |
          python - <<'EOF'
          import os
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("is_trading_day=true\n")
          EOF

      - name: Run Market Briefing Engine
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: python market_briefing_engine.py auto
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit market intelligence data to repo
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/market_intelligence.json public/market_briefs.json || true
          git diff --staged --quiet || git commit -m "data: market_intelligence $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done

  deploy:
    needs: market-intel
    if: needs.market-intel.outputs.is_trading_day == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-

      - name: Build React app
        run: npm ci --legacy-peer-deps && npm run build
        env:
          CI: false
          REACT_APP_FINNHUB_KEY: ${{ secrets.FINNHUB_API_KEY }}
          REACT_APP_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          REACT_APP_TV_PROXY_URL: ${{ secrets.TV_PROXY_URL }}

      # Same guard as deploy.yml: this workflow also builds and deploys the whole
      # site, so a build without REACT_APP_TV_PROXY_URL / REACT_APP_FINNHUB_KEY
      # silently replaces a good deploy with one where Mini Charts show
      # "Bar-data proxy not configured" and news/catalysts have no data
      # (found 2026-10-01: this workflow's last run had removed both).
      - name: Verify required secrets reached the build
        env:
          TV_PROXY_URL: ${{ secrets.TV_PROXY_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          fail=0
          check() {
            name="$1"; value="$2"
            if [ -z "$value" ]; then
              echo "::error::$name repo secret is empty or missing."
              fail=1
              return
            fi
            if ! grep -rqF -- "$value" build/static/js/*.js; then
              echo "::error::$name is set but never made it into the build output."
              fail=1
            fi
          }
          check "TV_PROXY_URL" "$TV_PROXY_URL"
          check "FINNHUB_API_KEY" "$FINNHUB_API_KEY"
          if [ "$fail" = "1" ]; then
            echo "::error::Blocking deploy - a broken build must not reach production silently."
            exit 1
          fi
          echo "TV_PROXY_URL and FINNHUB_API_KEY both present in build output."

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

      - id: deployment
        uses: actions/deploy-pages@v5
